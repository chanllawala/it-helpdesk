databases:
  - name: it-helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk

services:
  - type: web
    name: it-helpdesk-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Seeding is idempotent (no-ops once users exist), so it is safe to run on
    # every boot. Render's Shell/Jobs features are paid-only, so this is how the
    # demo data gets into the production database.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: it-helpdesk-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://it-helpdesk-frontend-3lpf.onrender.com
      - key: PYTHON_VERSION
        value: 3.13.7

  - type: web
    name: it-helpdesk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://it-helpdesk-backend-5s1n.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
